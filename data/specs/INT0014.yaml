blocks:
- structure: if
  rules:
  - title: Senior saver bonus
    intent: Add 0.5% to the base rate for customers aged 55 or over with at least 5,000 on deposit; everyone else gets the
      base rate.
    concepts:
    - interest
    - age
    - senior
    - balance
    - bonus
    when:
      all:
      - field: customer_age
        op: '>='
        value: 55
      - field: balance
        op: '>='
        value: 5000
    then:
    - compute: bonus_rate
      expr: base_rate + 0.0050
    else:
    - set: bonus_rate
      from: base_rate
    id: R1
  paragraph: APPLY-BONUS
- structure: if
  rules:
  - title: Fixed deposit uplift
    intent: Add a further 0.1% to the rate for fixed deposit accounts.
    concepts:
    - interest
    - fixed deposit
    - account type
    - bonus
    when:
      field: account_type
      op: ==
      value: F
    then:
    - compute: bonus_rate
      expr: bonus_rate + 0.0010
    id: R1
  paragraph: 2600-FIXED-DEP
