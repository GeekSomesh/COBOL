blocks:
- structure: if
  rules:
  - title: Repeat late payer suspension
    intent: Suspend the account and add a 50 penalty when a customer with 4 or more late payments in 12 months is over 30
      days late.
    concepts:
    - penalty
    - repeat
    - suspension
    - days late
    when:
      all:
      - field: late_count_12m
        op: '>='
        value: 4
      - field: days_late
        op: '>'
        value: 30
    then:
    - set: account_status
      value: S
    - add: penalty_amt
      value: 50
    id: R1
  paragraph: REPEAT-OFFENDER
- structure: if
  rules:
  - title: Collections referral
    intent: Move accounts more than 90 days late to collections.
    concepts:
    - collections
    - days late
    - account status
    when:
      field: days_late
      op: '>'
      value: 90
    then:
    - set: account_status
      value: C
    id: R1
  paragraph: 4100-TO-COLLECTIONS
