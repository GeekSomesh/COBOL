blocks:
- structure: if
  rules:
  - title: Benefits eligibility
    intent: Make full-time employees, and part-time employees working at least 25 hours, eligible for benefits.
    concepts:
    - benefits
    - eligibility
    - employee type
    - hours
    when:
      any:
      - field: employee_type
        op: ==
        value: F
      - all:
        - field: employee_type
          op: ==
          value: P
        - field: hours_worked
          op: '>='
          value: 25
    then:
    - set: benefits_flag
      value: Y
    id: R1
  paragraph: CHECK-BENEFITS
- structure: if
  rules:
  - title: Pension contribution rate
    intent: Contribute 6% to the pension for enrolled employees with at least 2 years of service, otherwise 2%.
    concepts:
    - pension
    - service years
    - contribution
    when:
      all:
      - field: pension_opt_in
        op: ==
        value: Y
      - field: years_service
        op: '>='
        value: 2
    then:
    - set: pension_rate
      value: 0.06
    else:
    - set: pension_rate
      value: 0.02
    id: R1
  paragraph: SET-PENSION
