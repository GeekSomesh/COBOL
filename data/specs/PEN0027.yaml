    - penalty
    - repeat
    - suspension
    - days late
    when:
      all:
      - field: late_count_12m
        op: '>='
        value: 3
      - field: days_late
        op: '>'
        value: 30
    then:
    - set: account_status
      value: S
    - add: penalty_amt
      value: 100
    id: R1
  paragraph: 4000-REPEAT-LATE
- structure: if
  rules:
  - title: Collections referral
    intent: Move accounts more than 60 days late to collections.
