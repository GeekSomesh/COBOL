blocks:
- structure: if
  rules:
  - title: Benefits eligibility
    intent: Make full-time employees, and part-time employees working at least 30 hours, eligible for benefits.
    concepts:
    - benefits
    - eligibility
    - employee type
    - hours
    when:
      any:
      - field: employee_type
        op: ==
        value: F
      - all:
        - field: employee_type
          op: ==
          value: P
        - field: hours_worked
          op: '>='
          value: 30
    then:
    - set: benefits_flag
      value: Y
    id: R1
  paragraph: BENEFIT-ELIG
- structure: if
  rules:
  - title: Pension contribution rate
    intent: Contribute 5% to the pension for enrolled employees with at least 3 years of service, otherwise 2%.
    concepts:
    - pension
    - service years
    - contribution
    when:
      all:
      - field: pension_opt_in
        op: ==
        value: Y
      - field: years_service
        op: '>='
        value: 3
    then:
    - set: pension_rate
      value: 0.05
    else:
    - set: pension_rate
      value: 0.02
    id: R1
  paragraph: PENSION-CONTRIB
