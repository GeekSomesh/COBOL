- structure: if
  rules:
  - title: Business high-volume surcharge
    intent: Add a 10 surcharge for business accounts with more than 45 transactions in the month.
    concepts:
    - fee
    - business
    - account type
    - transaction count
    when:
      all:
      - field: account_type
