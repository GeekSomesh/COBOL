- structure: if
  rules:
  - title: Free standard shipping
    intent: Ship standard orders of at least 75 for free.
    concepts:
    - shipping
    - free shipping
    - order value
    when:
      all:
      - field: order_value
        op: '>='
        value: 75
      - field: service_level
        op: ==
        value: S
    then:
    - set: free_shipping
      value: Y
    - set: ship_charge
      value: 0
    id: R1
  paragraph: FREE-SHIPPING
- structure: if
  rules:
  - title: Remote zone surcharge
    intent: Add a 15 surcharge for deliveries to zones Z7, ZR.
    concepts:
    - shipping
    - zone
    - surcharge
    when:
      field: dest_zone
      op: in
      value: &id001
      - Z7
      - ZR
    then:
    - set: surcharge
      value: 15
    id: R1
  paragraph: ZONE-SURCHARGE
