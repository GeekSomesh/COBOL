    - fee
    - waiver
    - student
    - age
    when:
      all:
      - field: student_flag
        op: ==
        value: Y
      - field: customer_age
        op: <
        value: 25
    then:
    - set: fee_waived
      value: Y
    - set: monthly_fee
      value: 0
    id: R1
  - title: Senior fee waiver
    intent: Waive the monthly fee for customers aged 60 or over.
    concepts:
    - fee
    - waiver
    - senior
    - age
    when:
      field: customer_age
      op: '>='
      value: 60
    then:
    - set: fee_waived
      value: Y
    - set: monthly_fee
      value: 0
    id: R2
  - title: Standard monthly fee
    intent: Charge everyone else the standard monthly fee of 4.
    concepts:
