- structure: if
  rules:
  - title: Excess transaction fee
    intent: Charge 0.50 for each transaction above 25 in the month.
    concepts:
    - fee
    - transaction count
    - excess
    when:
      field: txn_count_month
      op: '>'
      value: 25
    then:
    - compute: excess_fee
      expr: (txn_count_month - 25) * 0.50
    id: R1
  paragraph: 3000-COUNT-FEE
- structure: if
  rules:
  - title: Business high-volume surcharge
    intent: Add a 25 surcharge for business accounts with more than 45 transactions in the month.
    concepts:
    - fee
    - business
    - account type
    - transaction count
    when:
      all:
      - field: account_type
        op: ==
        value: B
      - field: txn_count_month
        op: '>'
        value: 45
    then:
    - add: excess_fee
      value: 25
    id: R1
  paragraph: BUSINESS-SURCHARGE
