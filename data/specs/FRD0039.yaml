  - title: Card-not-present online purchase
    intent: Hold online card-not-present transactions above 1,250 and send them for review.
    concepts:
    - channel
    - online
    - card not present
    - amount
    - hold
    when:
      all:
      - field: card_present
        op: ==
        value: N
      - field: transaction_amount
        op: '>'
        value: 1250
    then:
    - set: hold_flag
      value: Y
    - set: review_flag
      value: Y
    id: R1
  - title: Large online transaction
    intent: Send online transactions above 5,000 for review.
    concepts:
    - channel
    - online
    - amount
    - review
    when:
      field: transaction_amount
      op: '>'
      value: 5000
    then:
    - set: review_flag
      value: Y
    id: R2
  outer:
    field: channel_code
    op: ==
    value: O
  outer_else:
    title: Non-online transaction
    intent: Never hold transactions made outside the online channel.
    concepts:
