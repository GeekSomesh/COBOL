blocks:
- structure: if
  rules:
  - title: Senior saver bonus
    intent: Add 0.25% to the base rate for customers aged 62 or over with at least 10,000 on deposit; everyone else gets the
      base rate.
    concepts:
    - interest
    - age
    - senior
    - balance
    - bonus
    when:
      all:
      - field: customer_age
        op: '>='
        value: 62
      - field: balance
        op: '>='
        value: 10000
    then:
    - compute: bonus_rate
      expr: base_rate + 0.0025
    else:
    - set: bonus_rate
      from: base_rate
    id: R1
  paragraph: 2500-SENIOR-RATE
- structure: if
  rules:
  - title: Fixed deposit uplift
    intent: Add a further 0.15% to the rate for fixed deposit accounts.
    concepts:
    - interest
    - fixed deposit
    - account type
    - bonus
    when:
      field: account_type
      op: ==
      value: F
    then:
    - compute: bonus_rate
      expr: bonus_rate + 0.0015
    id: R1
  paragraph: FIXED-UPLIFT
