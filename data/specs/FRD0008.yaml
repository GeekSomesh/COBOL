  - title: Very high transaction velocity
    intent: Rate activity as high risk when more than 20 transactions in 24 hours include one above 7,000.
    concepts:
    - velocity
    - transaction count
    - amount
    - risk
    when:
      all:
      - field: txn_count_24h
        op: '>'
        value: 20
      - field: transaction_amount
        op: '>'
        value: 7000
    then:
    - set: risk_level
      value: H
    - set: risk_score
      value: 90
    id: R1
  - title: Elevated transaction velocity
    intent: Rate activity as medium risk when the customer made more than 8 transactions in the last 24 hours.
    concepts:
    - velocity
    - transaction count
    - risk
    when:
      field: txn_count_24h
      op: '>'
      value: 8
    then:
    - set: risk_level
      value: M
    - set: risk_score
      value: 60
    id: R2
  - title: Activity on new account
    intent: Rate activity on accounts opened less than 60 days ago as medium risk.
    concepts:
    - account age
    - new account
    - risk
    when:
      field: account_age_days
      op: <
      value: 60
    then:
    - set: risk_level
      value: M
    - set: risk_score
      value: 40
    id: R3
  - title: Normal activity
    intent: Rate all other activity as low risk.
    concepts:
    - risk
    - default
    when: null
    then:
    - set: risk_level
      value: L
    - set: risk_score
      value: 10
    id: R4
