- structure: if
  rules:
  - title: High-value transaction by minor
    intent: Flag transactions over 7,500 made by customers younger than 16 for manual review.
    concepts:
    - age
    - amount
    - minor
    - review
    when:
      all:
      - field: customer_age
        op: <
        value: 16
      - field: transaction_amount
        op: '>'
        value: 7500
    then:
    - set: review_flag
      value: Y
    id: R1
  paragraph: CHECK-TXN
- structure: if
  rules:
  - title: Large transaction from high-risk region
    intent: Flag transactions over 25,000 that originate from high-risk country codes XC for review.
    concepts:
    - amount
    - geography
    - country
    - review
    when:
      all:
      - field: transaction_amount
        op: '>'
        value: 25000
      - field: country_code
        op: ==
        value: XC
    then:
    - set: review_flag
      value: Y
    id: R1
  paragraph: HIGH-RISK-REGION
