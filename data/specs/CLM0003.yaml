  - title: Deductible applies
    intent: Pay the claimed amount minus the deductible for any other claim with an amount.
    concepts:
    - claim
    - deductible
    - payout
    when:
      field: claim_amount
      op: '>'
      value: 0
    then:
    - compute: payout_amt
      expr: claim_amount - deductible
    id: R2
