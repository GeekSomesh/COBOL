  - title: Auto claim without police report
    intent: Refer auto claims above 10,000 without a police report to special investigations.
    concepts:
    - claim
    - auto
    - police report
    - fraud
    - referral
    when:
      all:
      - field: claim_type
        op: ==
        value: A
      - field: police_report
        op: ==
        value: N
      - field: claim_amount
        op: '>'
        value: 10000
    then:
    - set: siu_referral
      value: Y
    - set: claim_status
      value: I
    id: R1
  paragraph: 3000-AUTO-REPORT
- structure: if
  rules:
  - title: Frequent claimant
    intent: Refer customers with 3 or more prior claims to special investigations.
    concepts:
