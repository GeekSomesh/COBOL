blocks:
- structure: chain
  rules:
  - title: No overtime for contractors
    intent: Pay no overtime to contractors.
    concepts:
    - overtime
    - contractor
    - employee type
    when:
      field: employee_type
      op: ==
      value: C
    then:
    - set: overtime_pay
      value: 0
    id: R1
  - title: Heavy overtime
    intent: Add 25% of gross pay as overtime when more than 50 hours were worked.
    concepts:
    - overtime
    - hours
    - gross pay
    when:
      field: hours_worked
      op: '>'
      value: 50
    then:
    - compute: overtime_pay
      expr: gross_pay * 0.25
    id: R2
  - title: Standard overtime
    intent: Add 10% of gross pay as overtime when more than 44 hours were worked.
    concepts:
    - overtime
    - hours
    - gross pay
    when:
      field: hours_worked
      op: '>'
      value: 44
    then:
    - compute: overtime_pay
      expr: gross_pay * 0.10
    id: R3
  - title: No overtime
    intent: Pay no overtime otherwise.
    concepts:
    - overtime
    - default
    when: null
    then:
    - set: overtime_pay
      value: 0
    id: R4
  paragraph: 2000-OVERTIME
