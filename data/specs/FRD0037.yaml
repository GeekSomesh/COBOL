blocks:
- structure: if
  rules:
  - title: High-value transaction by minor
    intent: Flag transactions over 9,000 made by customers younger than 21 for manual review.
    concepts:
    - age
    - amount
    - minor
    - review
    when:
      all:
      - field: customer_age
        op: <
        value: 21
      - field: transaction_amount
        op: '>'
        value: 9000
    then:
    - set: review_flag
      value: Y
    id: R1
  paragraph: 2000-CHECK-MINOR
- structure: if
  rules:
  - title: Large transaction from high-risk region
    intent: Flag transactions over 70,000 that originate from high-risk country codes XA and raise a fraud alert.
    concepts:
    - amount
    - geography
    - country
    - review
    - alert
    when:
      all:
      - field: transaction_amount
        op: '>'
        value: 70000
      - field: country_code
        op: ==
        value: XA
    then:
    - set: review_flag
      value: Y
    - call: FRDALERT
    id: R1
  paragraph: HIGH-RISK-REGION
