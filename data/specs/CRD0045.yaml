    - credit limit
    - credit score
    - income
    when:
      field: credit_score
      op: '>='
      value: 760
    then:
    - compute: credit_limit
      expr: annual_income * 0.30
    id: R1
  - title: Standard credit limit
    intent: Set the credit limit to 20% of annual income for scores of 680 or more.
    concepts:
    - credit limit
    - credit score
    - income
    when:
      field: credit_score
      op: '>='
      value: 680
    then:
    - compute: credit_limit
      expr: annual_income * 0.20
    id: R2
  - title: Minimum credit limit
    intent: Give every other approved applicant the minimum limit of 1,000.
    concepts:
    - credit limit
    - default
    when: null
    then:
