    - fixed deposit
    - account type
    - bonus
    when:
      field: account_type
      op: ==
      value: F
    then:
    - compute: bonus_rate
      expr: bonus_rate + 0.0010
    id: R1
  paragraph: 2600-FIXED-DEP
