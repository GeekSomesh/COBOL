blocks:
- structure: chain
  rules:
  - title: Fast-track small claim
    intent: Approve claims of 2,500 or less from customers with fewer than 2 prior claims.
    concepts:
    - claim
    - amount
    - prior claims
    - approval
    when:
      all:
      - field: claim_amount
        op: <=
        value: 2500
      - field: prior_claims
        op: <
        value: 2
    then:
    - set: claim_status
      value: A
    id: R1
  - title: Large claim investigation
    intent: Investigate claims above 50,000.
    concepts:
    - claim
    - amount
    - investigation
    when:
      field: claim_amount
      op: '>'
      value: 50000
    then:
    - set: claim_status
      value: I
    id: R2
  - title: New policy claim
    intent: Investigate claims on policies younger than 3 months.
    concepts:
    - claim
    - policy age
    - investigation
    when:
      field: policy_age_months
      op: <
      value: 3
    then:
    - set: claim_status
      value: I
    id: R3
  - title: Standard claim
    intent: Approve all other claims.
    concepts:
    - claim
    - approval
    - default
    when: null
    then:
    - set: claim_status
      value: A
    id: R4
