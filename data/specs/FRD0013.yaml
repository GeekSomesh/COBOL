blocks:
- structure: if
  rules:
  - title: High-value transaction by minor
    intent: Flag transactions over 4,500 made by customers younger than 18 for manual review.
    concepts:
    - age
    - amount
    - minor
    - review
    when:
      all:
      - field: customer_age
        op: <
        value: 18
      - field: transaction_amount
        op: '>'
        value: 4500
    then:
    - set: review_flag
      value: Y
    id: R1
  paragraph: MINOR-TXN-CHECK
- structure: if
  rules:
  - title: Large transaction from high-risk region
    intent: Flag transactions over 80,000 that originate from high-risk country codes XB, XD and raise a fraud alert.
    concepts:
    - amount
    - geography
    - country
    - review
    - alert
    when:
      all:
      - field: transaction_amount
        op: '>'
        value: 80000
      - field: country_code
        op: in
        value:
        - XB
        - XD
    then:
    - set: review_flag
      value: Y
    - call: FRDALERT
    id: R1
  paragraph: CHECK-REGION
