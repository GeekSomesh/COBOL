blocks:
- structure: if
  rules:
  - title: Excess transaction fee
    intent: Charge 0.25 for each transaction above 15 in the month.
    concepts:
    - fee
    - transaction count
    - excess
    when:
      field: txn_count_month
      op: '>'
      value: 15
    then:
    - compute: excess_fee
      expr: (txn_count_month - 15) * 0.25
    id: R1
  paragraph: CHARGE-EXCESS
- structure: if
  rules:
  - title: Business high-volume surcharge
    intent: Add a 10 surcharge for business accounts with more than 45 transactions in the month.
    concepts:
    - fee
    - business
    - account type
    - transaction count
    when:
      all:
      - field: account_type
        op: ==
        value: B
      - field: txn_count_month
        op: '>'
        value: 45
    then:
    - add: excess_fee
      value: 10
    id: R1
  paragraph: HIGH-VOLUME-FEE
