- structure: chain
  rules:
  - title: Very high transaction velocity
    intent: Rate activity as high risk when more than 15 transactions in 24 hours include one above 8,000.
    concepts:
    - velocity
    - transaction count
    - amount
    - risk
    when:
      all:
      - field: txn_count_24h
        op: '>'
        value: 15
      - field: transaction_amount
        op: '>'
        value: 8000
    then:
    - set: risk_level
      value: H
    - set: risk_score
      value: 90
    id: R1
  - title: Elevated transaction velocity
    intent: Rate activity as medium risk when the customer made more than 6 transactions in the last 24 hours.
    concepts:
    - velocity
    - transaction count
    - risk
    when:
      field: txn_count_24h
      op: '>'
      value: 6
    then:
    - set: risk_level
      value: M
    - set: risk_score
      value: 60
    id: R2
  - title: Activity on new account
    intent: Rate activity on accounts opened less than 30 days ago as medium risk.
    concepts:
    - account age
    - new account
    - risk
    when:
      field: account_age_days
      op: <
      value: 30
    then:
    - set: risk_level
      value: M
    - set: risk_score
      value: 40
    id: R3
  - title: Normal activity
    intent: Rate all other activity as low risk.
    concepts:
    - risk
    - default
    when: null
    then:
    - set: risk_level
      value: L
    - set: risk_score
      value: 10
    id: R4
