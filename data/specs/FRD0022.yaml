blocks:
- structure: if
  rules:
  - title: High-value transaction by minor
    intent: Flag transactions over 9,500 made by customers younger than 18 for manual review.
    concepts:
    - age
    - amount
    - minor
    - review
    when:
      all:
      - field: customer_age
        op: <
        value: 18
      - field: transaction_amount
        op: '>'
        value: 9500
    then:
    - set: review_flag
      value: Y
    id: R1
  paragraph: MINOR-TXN-CHECK
- structure: if
  rules:
  - title: Large transaction from high-risk region
    intent: Flag transactions over 50,000 that originate from high-risk country codes XC and raise a fraud alert.
    concepts:
    - amount
    - geography
    - country
    - review
    - alert
    when:
      all:
      - field: transaction_amount
        op: '>'
        value: 50000
      - field: country_code
        op: ==
        value: XC
    then:
    - set: review_flag
      value: Y
    - call: FRDALERT
    id: R1
  paragraph: HIGH-RISK-REGION
