- structure: if
  rules:
  - title: Business high-volume surcharge
    intent: Add a 15 surcharge for business accounts with more than 45 transactions in the month.
    concepts:
    - fee
    - business
    - account type
    - transaction count
    when:
      all:
      - field: account_type
        op: ==
        value: B
      - field: txn_count_month
        op: '>'
        value: 45
    then:
    - add: excess_fee
      value: 15
    id: R1
  paragraph: BUSINESS-SURCHARGE
