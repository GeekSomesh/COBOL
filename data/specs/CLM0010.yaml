    id: R1
  - title: Large claim investigation
    intent: Investigate claims above 25,000.
    concepts:
    - claim
    - amount
    - investigation
    when:
      field: claim_amount
      op: '>'
      value: 25000
    then:
    - set: claim_status
      value: I
    id: R2
  - title: New policy claim
